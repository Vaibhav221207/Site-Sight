<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Sight</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Baloo 2 — rounded playful UI font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet" />
  <!-- Anime.js (CDN, required for popup micro-interactions) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
</head>
<body>
    <!-- Game canvas: extruded 3D isometric blocks, fills the browser window -->
    <canvas id="game-canvas"></canvas>

    <!-- Build palette: toggle bar that slides up above the HUD when
         "Build" is clicked; cards are generated from the BuildMenu registry -->
    <div id="build-bar" class="build-bar hidden">
      <div class="build-bar-head">
        <span class="build-bar-title">BUILD MENU</span>
      </div>
      <div id="build-items" class="build-items"></div>
    </div>

    <!-- HUD: always visible at the top, includes cash balance and build button -->
    <div id="hud" class="hud">
      <div class="hud-left">
        <span class="label">CASH</span>
        <span id="hud-cash" class="value">$0</span>
      </div>
      <button id="hud-build-btn" class="hud-btn">Build</button>
    </div>

    <!-- Full-screen HQ management overlay (terminal layout, separate from small tile popup) -->
    <div id="hq-overlay">
      <div id="hq-panel">
        <div class="hq-fs-header">
          <span class="hq-fs-title">CONTECH HQ</span>
          <button id="hq-close-btn" class="hq-fs-close" aria-label="Close panel">×</button>
        </div>
        <div class="hq-fs-body">
          <nav class="hq-fs-nav">
            <button id="hq-nav-data" class="hq-fs-nav-item">DATA</button>
            <button id="hq-nav-inventory" class="hq-fs-nav-item">INVENTORY</button>
            <button id="hq-nav-store" class="hq-fs-nav-item hq-fs-nav-item--active">STORE</button>
          </nav>
          <div class="hq-fs-content">
            <div id="hq-section-data" class="hq-fs-section" style="display:none">
              <div class="hq-fs-placeholder">Coming soon</div>
            </div>
            <div id="hq-section-inventory" class="hq-fs-section" style="display:none">
              <div class="hq-fs-placeholder">Coming soon</div>
            </div>
            <div id="hq-section-store" class="hq-fs-section">
              <div class="hq-fs-status">
                <div class="hq-fs-status-label">STATUS</div>
                <div class="hq-fs-status-text">Site command center — operational</div>
              </div>
              <div class="hq-fs-section">
                <div class="hq-fs-section-header">DRONE FLEET</div>
                <div class="hq-fs-drone-row">
                  <div class="hq-fs-drone-info">
                    <span class="hq-fs-drone-name">Drone System</span>
                    <span class="hq-fs-drone-cost">$5,000</span>
                  </div>
                  <button id="hq-order-drone-fs" class="hq-order-btn">Order Drone</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Glassmorphism tile inspection popup (animation shell only) -->
    <div id="tile-popup">
      <div class="panel-header">
        <span class="panel-title">SITE INSPECTION</span>
        <button class="panel-close" aria-label="Close popup">×</button>
      </div>
      <div class="panel-body">
        <div id="tile-coords" class="tile-coords">Tile: -, -</div>
        <div id="tile-placeholder" class="placeholder">
          NO DATA AVAILABLE — CONTECH HQ NOT YET CONSTRUCTED
        </div>
        <div id="hq-content" class="hq-content" style="display:none">
          <div class="hq-status">
            <div class="hq-status-label">STATUS</div>
            <div class="hq-status-text">Site command center — operational</div>
          </div>
          <div class="hq-section">
            <div class="hq-section-header">DRONE FLEET</div>
            <div class="hq-drone-row">
              <div class="hq-drone-info">
                <span class="hq-drone-name">Drone System</span>
                <span class="hq-drone-cost">$5,000</span>
              </div>
              <button id="hq-order-drone" class="hq-order-btn">Order Drone</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts loaded in dependency order (no bundler) -->
    <script src="js/isoGrid.js"></script>
    <script src="js/terrain.js"></script>
    <script src="js/blockRender.js"></script>
    <script src="js/input.js"></script>
    <script src="js/panel.js"></script>
    <script src="js/gameState.js"></script>
      <script src="js/hqBuild.js"></script>
    <script src="js/droneDeploy.js"></script>
    <script src="js/buildMenu.js"></script>
    <script src="js/hqPanel.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
